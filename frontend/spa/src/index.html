<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>SportBoard - Plataforma de Gestión Deportiva</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="SportBoard es una plataforma integral para la gestión de eventos deportivos, equipos y estadísticas">
    <meta name="keywords" content="deportes, torneos, estadísticas, equipos, gestión deportiva">
    <meta name="author" content="UNL - Carrera de Computación">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Preconnect para Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Permissions Policy para reducir warnings del navegador -->
    <meta http-equiv="Permissions-Policy" content="browsing-topics=()">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SportBoard - Plataforma de Gestión Deportiva">
    <meta property="og:description" content="Plataforma integral para la gestión de eventos deportivos, equipos y estadísticas">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sportboard.example.com">
    
    <!-- Theme Color for browser -->
    <meta name="theme-color" content="#1e88e5">
</head>

<body>
    <app-root></app-root>
    
    <!-- Script para suprimir warnings del navegador -->
    <script>
        // Suprimir warnings específicos del navegador en desarrollo
        if (window.console && window.console.warn) {
            const originalWarn = console.warn;
            console.warn = function(...args) {
                // Filtrar warnings específicos que no son críticos
                const message = args.join(' ');
                if (message.includes('runtime.lastError') || 
                    message.includes('Browsing Topics API') ||
                    message.includes('injection-topics.js')) {
                    return; // No mostrar estos warnings
                }
                originalWarn.apply(console, args);
            };
        }
        
        // Manejo global de errores no críticos
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('runtime.lastError')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>

</html>
