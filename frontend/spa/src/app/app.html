<!-- Header Section with Branding -->
<header role="banner">
    <app-header [sidebarOpened]="sidebarOpened" (menuClicked)="toggleSidebar()"></app-header>
</header>

<!-- Main Content Section -->
<main role="main">

    <mat-drawer-container>
        <!-- Sidebar Navigation -->
        <mat-drawer mode="side" [opened]="sidebarOpened">
            <aside>
                <app-sidebar></app-sidebar>
            </aside>
        </mat-drawer>

        <!-- Main Content Area -->
        <mat-drawer-content>

            <router-outlet></router-outlet>
        </mat-drawer-content>
    </mat-drawer-container>
</main>

<!-- Footer Section -->
<footer class="app-footer" role="contentinfo">
    <app-footer></app-footer>
</footer>
