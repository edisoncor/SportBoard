<div class="downloads-container">
  <h2>Descargar Estadísticas</h2>
  <p>Seleccione el tipo de estadísticas que desea descargar en formato PDF. Se generará un documento con todos los datos actuales.</p>
  
  <div class="download-options">
    <mat-card (click)="openConfirmDialog('teams')" [class.disabled]="isLoading">
      <mat-card-header>
        <mat-card-title>Equipos</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-icon>groups</mat-icon>
      </mat-card-content>
    </mat-card>

    <mat-card (click)="openConfirmDialog('matches')" [class.disabled]="isLoading">
      <mat-card-header>
        <mat-card-title>Partidos</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-icon>sports_soccer</mat-icon>
      </mat-card-content>
    </mat-card>

    <mat-card (click)="openConfirmDialog('players')" [class.disabled]="isLoading">
      <mat-card-header>
        <mat-card-title>Jugadores</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-icon>person</mat-icon>
      </mat-card-content>
    </mat-card>

    <mat-card (click)="openConfirmDialog('leaderboard')" [class.disabled]="isLoading">
      <mat-card-header>
        <mat-card-title>Tabla de Posiciones</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-icon>leaderboard</mat-icon>
      </mat-card-content>
    </mat-card>
  </div>

  <div *ngIf="isLoading" class="loading-overlay">
    <mat-spinner></mat-spinner>
    <p>Generando PDF, por favor espere...</p>
  </div>
</div>
