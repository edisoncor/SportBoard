<h2 mat-dialog-title>Estadísticas del Jugador</h2>
<mat-dialog-content>
  <div class="player-info">
    <img [src]="'assets/real-time-assets/players/' + data.player_id.photo" alt="{{ data.player_id.name }}" class="player-photo">
    <h3>{{ data.player_id.name }}</h3>
  </div>
  <div class="stats-container">
    <div class="stat-item">
      <span class="stat-type">Goles:</span>
      <span class="stat-value">{{ data.goals }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-type">Asistencias:</span>
      <span class="stat-value">{{ data.assists }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-type">Minutos Jugados:</span>
      <span class="stat-value">{{ data.minutes_played }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-type">Faltas:</span>
      <span class="stat-value">{{ data.fouls }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-type">Tarjetas Amarillas:</span>
      <span class="stat-value">{{ data.yellow_cards }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-type">Tarjetas Rojas:</span>
      <span class="stat-value">{{ data.red_cards }}</span>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onClose()">Cerrar</button>
</mat-dialog-actions>
