<div class="header-container">
    <!-- Sección izquierda: menú y brand juntos -->
    <div class="header-left">
        <div class="header-menu" role="button" aria-label="Abrir menú lateral" (click)="menuClicked.emit()">
            <mat-icon>{{ sidebarOpened ? 'menu_open' : 'menu' }}</mat-icon>
        </div>
        <div class="header-brand">
            <h1>SportBoard</h1>
        </div>
    </div>

    <!-- Sección centro: opciones/navegación -->
    <div class="header-center">
        <nav class="nav-options">
            <a href="#" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link">Deportes</a>
            <a href="#" class="nav-link">Estadísticas</a>
        </nav>
    </div>


    <!-- Sección derecha: usuario -->
    <div class="header-right">
        <div class="user-menu">
            <mat-icon class="user-icon">account_circle</mat-icon>
            <span class="user-name">Usuario</span>
            <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
            <div class="user-dropdown">
                <a href="#" class="dropdown-item">Perfil</a>
                <a href="#" class="dropdown-item">Configuración</a>
                <hr class="dropdown-divider">
                <a href="#" class="dropdown-item">Cerrar sesión</a>
            </div>
        </div>
    </div>
</div>
