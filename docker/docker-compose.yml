name: SportBoard-container

services:
    postgres:
        extends:
            file: ./api-gateway/docker-compose.override.yml
            service: postgres

    kong-migrations:
        extends:
            file: ./api-gateway/docker-compose.override.yml
            service: kong-migrations

    kong:
        extends:
            file: ./api-gateway/docker-compose.override.yml
            service: kong

# Microservicio de catálogo
    ms-catalog:
        extends:
            file: ./backend/ms-catalog/docker-compose.override.yml
            service: catalogs

networks:
    sportboard-network:
        name: sportboard-network
        driver: bridge

volumes:
    mariadb_data:
    static_volume:
    kong-db-data:
    mongodb_estadisticas_data:
