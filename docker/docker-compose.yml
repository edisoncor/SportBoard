name: SportBoard-container

services:
  # Base de datos para Kong
  kong-database:
    extends:
      file: ./api-gateway/docker-compose.override.yml
      service: kong-database

  # Migraciones de Kong
  kong-migrations:
    extends:
      file: ./api-gateway/docker-compose.override.yml
      service: kong-migrations

  # API Gateway Kong
  kong:
    extends:
      file: ./api-gateway/docker-compose.override.yml
      service: kong

  # Microservicio de catálogo
  ms-catalog:
    extends:
      file: ./backend/ms-catalog/docker-compose.override.yml
      service: catalogs

  # Microservicio de competencias
  ms-competencies:
    extends:
      file: ./backend/ms-competencies/docker-compose.override.yml
      service: competencies
    # ms-competencies:
    #   build:
    #     context: ../backend/ms-compentencies
    #   container_name: ms_competencies
    #   ports:
    #     - "8010:8010"
    #   volumes:
    #     - ../backend/ms-compentencies:/app
    #   environment:
    #     - PYTHONUNBUFFERED=1
    #   networks:
    #     - sportboard-network
      
  # RabbitMQ para mensajería
  rabbitmq:
    extends:
      file: ./message-broker/docker-compose.override.yml
      service: rabbitmq

networks:
  sportboard-network:
    name: sportboard-network
    driver: bridge

volumes:
  kong-db-data: