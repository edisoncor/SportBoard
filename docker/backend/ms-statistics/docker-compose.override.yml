services:
    ms-statistics:
        container_name: ms-statistics
        build:
            context: ../../../backend/ms-statistics
            dockerfile: Dockerfile
        ports:
            - "8012:8012"
        environment:
            - MONGO_URL=mongodb://mongo:27017/statistics
            - JWT_SECRET=supersecret
            - JWT_ALGORITHM=HS256
            - CORS_ORIGINS=*
            - TIMEZONE=UTC
        depends_on:
            - mongo
        networks:
            - sportboard-network

    mongo:
        image: mongo:7
        container_name: mongo
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        networks:
            - sportboard-network

volumes:
    mongo_data:

networks:
    sportboard-network:
        external: true
