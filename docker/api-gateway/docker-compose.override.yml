version: "3.8"
name: SportBoard-container

services:
    kong-database:
        image: postgres:15
        container_name: kong-database
        restart: always
        environment:
            POSTGRES_USER: kong
            POSTGRES_DB: kong
            POSTGRES_PASSWORD: kong
        volumes:
          - kong-db-data:/var/lib/postgresql/data
        networks:
            - sportboard-network

    kong-migrations:
        image: kong:3.6
        container_name: kong-migrations
        restart: "no"
        depends_on:
            - kong-database
        environment:
            KONG_DATABASE: postgres
            KONG_PG_HOST: kong-database
            KONG_PG_USER: kong
            KONG_PG_PASSWORD: kong
        command: kong migrations bootstrap
        networks:
            - sportboard-network

    kong:
        image: kong:3.6
        container_name: kong
        restart: always # reiniciar siempre
        depends_on:
            - kong-database # depende de la base de datos
            - kong-migrations
        environment:
            KONG_DATABASE: postgres # base de datos
            KONG_PG_HOST: kong-database # host de la base de datos
            KONG_PG_USER: kong # usuario de la base de datos
            KONG_PG_PASSWORD: kong # contraseña de la base de datos
            KONG_PROXY_ACCESS_LOG: /dev/stdout # logs de acceso
            KONG_ADMIN_ACCESS_LOG: /dev/stdout # logs de acceso
            KONG_PROXY_ERROR_LOG: /dev/stderr # logs de errores
            KONG_ADMIN_ERROR_LOG: /dev/stderr # logs de errores
            KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl # puerto de administración
            KONG_ADMIN_GUI_URL: http://localhost:8002 # url de la interfaz de administración
        ports:
            - "8000:8000"
            - "8443:8443"
            - "8001:8001"
            - "8444:8444"
            - "8002:8002"
        volumes:
            - ./kong.yml:/kong.yml
        command: >
            sh -c "
            kong config db_import /kong.yml &&
            kong start
            "
        networks:
            - sportboard-network

networks:
    sportboard-network:
        external: true

