_format_version: "2.1"
_transform: true

services:
    - name: ms-catalog-service
      url: http://ms-catalog:8009
      routes:
          - name: ms-catalog-categories-route
            paths:
                - /catalog/categories
                - /catalog/categories/
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                    replace:
                        uri: /api/v1/catalog/categories/
          - name: ms-catalog-items-route
            paths:
                - /catalog/items
                - /catalog/items/
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                    replace:
                        uri: /api/v1/catalog/items/

    - name: ms-auth-service
      url: http://ms-auth-service:8011
      routes:
        - name: ms-auth-route
          paths:
            - /api/v1/auth
          strip_path: false
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

    - name: ms-competencies
      url: http://ms-competencies:8010
      routes:
        - name: ms-competencies-route
          paths:
            - /competencies
          strip_path: true
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

    - name: ms-statistics-service
      url: http://ms-statistics:8012
      routes:
          - name: ms-statistics-route
            paths:
                - /statistics
            strip_path: false
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

plugins:
    - name: cors
      config:
          origins:
              - http://localhost:4200
              - http://localhost:65293
              - http://localhost:8002
              - http://10.0.2.2:8000
              - "*"  # Allow all origins for development
          methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
              - OPTIONS
          headers:
              - Accept
              - Accept-Encoding
              - Accept-Language
              - Authorization
              - Content-Type
              - Origin
              - X-Requested-With
              - Cache-Control
              - Pragma
              - Expires
              - x-client-name
              - x-client-version
              - Access-Control-Allow-Origin
              - Access-Control-Allow-Methods
              - Access-Control-Allow-Headers
              - Access-Control-Allow-Credentials
              - User-Agent
              - Referer
              - X-Forwarded-For
              - X-Forwarded-Proto
              - X-Real-IP
          exposed_headers:
              - X-Auth-Token
              - Content-Type
              - Authorization
          credentials: true
          max_age: 3600
          preflight_continue: false
